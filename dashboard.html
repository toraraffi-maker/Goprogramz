<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E2E2E2;
    --main: #2196F3;
    --second: #1591DC;
    --third: #90CAF9;
    --gradasi: #0F2854;
    --black: #1E1E1E;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    font-family: 'Poppins', sans-serif;
    color: var(--black);
  }

  /* ===== Navbar (Oswald) ===== */
  .navbar{
    background: var(--main);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 40px;
  }

  .navbar .nav-links{
    display: flex;
    gap: 40px;
  }

  .navbar .nav-links span{
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    color: #fff;
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
  }

  .navbar .nav-links span:hover{
    color: var(--gradasi);
  }

  .profile-icon-nav{
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .profile-icon-nav svg{ width: 26px; height: 26px; }

  /* ===== Layout ===== */
  .container{
    max-width: 1440px;
    margin: 0 auto;
    padding: 50px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    filter: blur(0px);
    transition: filter 0.2s ease;
  }

  body.locked .container{
    filter: blur(6px);
    pointer-events: none;
    user-select: none;
  }

  /* ===== Left: Profile ===== */
  .profile-section{
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .profile-icon-big svg{
    width: 110px;
    height: 110px;
    color: var(--main);
  }

  .profile-info p{
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    line-height: 1.6;
    color: var(--black);
  }

  .profile-info p:first-child{
    font-weight: 700;
    font-size: 20px;
  }

  .btn-row{
    display: flex;
    gap: 20px;
    margin-top: 28px;
  }

  .btn-pill{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: #fff;
    background: var(--main);
    border: none;
    border-radius: 30px;
    padding: 16px 30px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .btn-pill:hover{
    background: var(--second);
  }

  .achievement-title{
    font-family: 'Poppins', sans-serif;
    font-size: 22px;
    font-weight: 600;
    margin-top: 40px;
    margin-bottom: 20px;
  }

  .achievement-icons{
    display: flex;
    gap: 20px;
  }

  .achievement-icons .dot{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--gradasi);
    cursor: pointer;
    transition: transform 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .achievement-icons .dot.locked{
    background: #9aa5b1;
  }

  .achievement-icons .dot:hover{
    transform: scale(1.08);
  }

  /* ===== Right: Rekam Belajar ===== */
  .rekam-belajar h2{
    font-family: 'Poppins', sans-serif;
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .rekam-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .rekam-grid .card{
    background: var(--main);
    height: 62px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    padding: 0 16px;
    text-align: center;
  }

  .rekam-grid .card:hover{
    background: var(--second);
  }

  /* ===== Bottom: chart ===== */
  .chart-section{
    grid-column: 1 / -1;
    text-align: center;
    margin-top: 20px;
  }

  .chart-section h2{
    font-family: 'Poppins', sans-serif;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 30px;
  }

  .chart-wrap{
    max-width: 900px;
    margin: 0 auto;
    height: 320px;
  }

  /* ===== Login popup ===== */
  .login-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 40, 84, 0.55);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }

  body.locked .login-overlay{
    display: flex;
  }

  .login-modal{
    background: #fff;
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }

  .login-modal .icon-wrap{
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--third);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }

  .login-modal .icon-wrap svg{
    width: 34px;
    height: 34px;
    color: var(--gradasi);
  }

  .login-modal h3{
    font-family: 'Poppins', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--black);
  }

  .login-modal p{
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    color: #555;
    line-height: 1.5;
    margin-bottom: 26px;
  }

  .login-modal .modal-btn-row{
    display: flex;
    gap: 14px;
  }

  .login-modal button{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: 30px;
    padding: 14px 0;
    flex: 1;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .login-modal #btnGoLogin{
    color: #fff;
    background: var(--main);
  }

  .login-modal #btnGoLogin:hover{
    background: var(--second);
  }

  .login-modal #btnGoDaftar{
    color: var(--main);
    background: #fff;
    border: 2px solid var(--main);
    padding: 12px 0;
  }

  .login-modal #btnGoDaftar:hover{
    background: var(--third);
    color: var(--gradasi);
    border-color: var(--third);
  }

  @media (max-width: 900px){
    .container{ grid-template-columns: 1fr; }
    .navbar .nav-links{ gap: 20px; }
    .navbar{ padding: 16px 20px; }
    .profile-section{ flex-direction: column; align-items: center; text-align: center; }
    .btn-row{ flex-wrap: wrap; justify-content: center; }
  }

  /* ===== Sidebar Profil ===== */
  .sidebar-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 40, 84, 0.35);
    z-index: 1000;
  }

  body.sidebar-open .sidebar-overlay{
    display: block;
  }

  .sidebar{
    position: fixed;
    top: 0;
    right: -320px;
    width: 300px;
    height: 100%;
    background: var(--main);
    z-index: 1001;
    transition: right 0.3s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body.sidebar-open .sidebar{
    right: 0;
  }

  .sidebar-stripe{
    height: 68px;
    display: flex;
    align-items: center;
  }

  .sidebar-stripe.odd{
    background: rgba(255,255,255,0.08);
  }

  .sidebar-header{
    padding: 28px 24px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .sidebar-header .avatar{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .sidebar-header .avatar svg{
    width: 30px;
    height: 30px;
    color: var(--main);
  }

  .sidebar-header .info p{
    font-family: 'Poppins', sans-serif;
    color: #fff;
  }

  .sidebar-header .info p:first-child{
    font-weight: 700;
    font-size: 17px;
  }

  .sidebar-header .info p:last-child{
    font-size: 13px;
    opacity: 0.9;
  }

  .sidebar-close{
    position: absolute;
    top: 22px;
    right: 20px;
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }

  .sidebar-menu{
    flex: 1;
    display: flex;
    flex-direction: column;
    padding-top: 8px;
  }

  .sidebar-menu button{
    all: unset;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 24px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: #fff;
    cursor: pointer;
  }

  .sidebar-menu button:hover{
    background: rgba(255,255,255,0.12);
  }

  .sidebar-menu button svg{
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .sidebar-logout-wrap{
    padding: 20px 24px 28px;
  }

  .sidebar-logout-wrap button{
    all: unset;
    display: block;
    width: 100%;
    text-align: center;
    background: #f4e9e9;
    color: #c0392b;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 12px 0;
    border-radius: 30px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .sidebar-logout-wrap button:hover{
    background: #eddcdc;
  }

  @media (max-width: 480px){
    .sidebar{ width: 85%; right: -85%; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-links">
    <span>BERANDA</span>
    <span>MATERI</span>
    <span>PRAKTEK</span>
  </div>
  <div class="profile-icon-nav" id="btnOpenSidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2196F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
    </svg>
  </div>
</nav>

<div class="container">

  <!-- Left: Profile -->
  <div>
    <div class="profile-section">
      <div class="profile-icon-big">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7.5" r="4"></circle>
          <path d="M3 21c0-5 4-8.5 9-8.5s9 3.5 9 8.5"></path>
        </svg>
      </div>
      <div class="profile-info">
        <p id="pUsername">Hai, Username</p>
        <p id="pFullname">Nama lengkap user</p>
        <p id="pId">ID User</p>
        <p id="pHeadline">Headline</p>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-pill">Edit Profile</button>
      <button class="btn-pill">Lihat Arsip</button>
    </div>

    <div class="achievement-title">Achievement</div>
    <div class="achievement-icons" id="achievementIcons"></div>
  </div>

  <!-- Right: Rekam Belajar -->
  <div class="rekam-belajar">
    <h2>Rekam Belajar</h2>
    <div class="rekam-grid" id="rekamGrid"></div>
  </div>

  <!-- Bottom: chart -->
  <div class="chart-section">
    <h2>Rekam Aktivitas Mingguan</h2>
    <div class="chart-wrap">
      <canvas id="weeklyChart"></canvas>
    </div>
  </div>

</div>

<!-- Popup wajib login -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-modal">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h3>Yuk, masuk dulu</h3>
    <p>Login atau daftar akun terlebih dahulu untuk melihat data dashboard kamu.</p>
    <div class="modal-btn-row">
      <button id="btnGoLogin">Login</button>
      <button id="btnGoDaftar">Daftar</button>
    </div>
  </div>
</div>

<!-- Sidebar Profil -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="profileSidebar">
  <button class="sidebar-close" id="btnCloseSidebar" aria-label="Tutup">&times;</button>

  <div class="sidebar-header">
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="7.5" r="4"></circle>
        <path d="M3 21c0-5 4-8.5 9-8.5s9 3.5 9 8.5"></path>
      </svg>
    </div>
    <div class="info">
      <p id="sbUsername">Hai, Username</p>
      <p id="sbId">ID User</p>
    </div>
  </div>

  <div class="sidebar-menu">
    <button class="sidebar-item" data-target="profil-saya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20l9-9-4-4-9 9v4h4z"></path>
        <path d="M14.5 5.5l4 4"></path>
      </svg>
      Profil Saya
    </button>
    <button class="sidebar-item" data-target="pengaturan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20l9-9-4-4-9 9v4h4z"></path>
        <path d="M14.5 5.5l4 4"></path>
      </svg>
      Pengaturan
    </button>
    <button class="sidebar-item" data-target="koleksi-saya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20l9-9-4-4-9 9v4h4z"></path>
        <path d="M14.5 5.5l4 4"></path>
      </svg>
      Koleksi Saya
    </button>
  </div>

  <div class="sidebar-logout-wrap">
    <button id="btnLogout">Log out</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
  /* ==========================================================
     GANTI SESUAI NAMA FILE HALAMAN LOGIN / DAFTAR KAMU
     KALAU LOKASI/NAMA FILENYA BERBEDA.
  ========================================================== */
  const LOGIN_PAGE_URL = "login.html";
  const DAFTAR_PAGE_URL = "daftar.html";

  /* =========== 1. DATA USER (dibaca dari localStorage, hasil dari daftar.html/login.html) =========== */
  // Kalau field belum ada di localStorage (misal user lama sebelum ada field ini),
  // dipakai nilai dummy di belakang tanda || sebagai fallback.
  const dashboardData = {
    username: localStorage.getItem("userUsername") || "Username",
    fullname: localStorage.getItem("userFullname") || "Nama lengkap user",
    headline: "Pelajar Semangat Belajar",
    achievements: 5,          // jumlah achievement yang sudah didapat
    achievementTotal: 5,      // total slot achievement yang ditampilkan
    rekamBelajar: [
      "Materi 1", "Materi 2",
      "Materi 3", "Materi 4",
      "Materi 5", "Materi 6"
    ],
    weeklyActivity: {
      labels: ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"],
      values: [8, 16, 16, 7, 9, 13, 21]
    }
  };

  /* =========== 2. ID USER OTOMATIS (pakai crypto.randomUUID) =========== */
  // crypto.randomUUID() adalah fitur bawaan browser (Web Crypto API),
  // menghasilkan UUID v4 yang levelnya standar industri untuk unique ID.
  // Butuh konteks aman (HTTPS atau localhost) — kalau tidak tersedia,
  // otomatis jatuh ke metode cadangan (timestamp + random) di bawahnya.
  function getOrCreateUserId(){
    let id = localStorage.getItem("userId");
    if(!id){
      if(window.crypto && typeof crypto.randomUUID === "function"){
        id = "USR-" + crypto.randomUUID();
      } else {
        // fallback kalau crypto.randomUUID tidak tersedia (misal dibuka lewat file:// langsung)
        const timestampPart = Date.now().toString(36).toUpperCase();
        const randomPart = Math.random().toString(36).substring(2, 8).toUpperCase();
        id = "USR-" + timestampPart + "-" + randomPart;
      }
      localStorage.setItem("userId", id);
    }
    return id;
  }

  /* =========== 3. CEK STATUS LOGIN =========== */
  // isLoggedIn disimpan di localStorage oleh halaman login setelah user berhasil masuk.
  // Ganti logika ini sesuai sistem auth kamu (misal cek token/session dari backend).
  function isUserLoggedIn(){
    return localStorage.getItem("isLoggedIn") === "true";
  }

  function lockDashboard(){
    document.body.classList.add("locked");
  }

  function unlockDashboard(){
    document.body.classList.remove("locked");
  }

  /* =========== 4. RENDER DATA KE HALAMAN =========== */
  function renderProfile(){
    document.getElementById("pUsername").textContent = "Hai, " + dashboardData.username;
    document.getElementById("pFullname").textContent = dashboardData.fullname;
    document.getElementById("pId").textContent = getOrCreateUserId();
    document.getElementById("pHeadline").textContent = dashboardData.headline;

    // isi data yang sama di sidebar profil
    document.getElementById("sbUsername").textContent = "Hai, " + dashboardData.username;
    document.getElementById("sbId").textContent = getOrCreateUserId();
  }

  function renderAchievements(){
    const wrap = document.getElementById("achievementIcons");
    wrap.innerHTML = "";
    for(let i = 0; i < dashboardData.achievementTotal; i++){
      const dot = document.createElement("div");
      dot.className = "dot" + (i < dashboardData.achievements ? "" : " locked");
      dot.title = i < dashboardData.achievements ? "Achievement diraih" : "Belum diraih";
      wrap.appendChild(dot);
    }
  }

  function renderRekamBelajar(){
    const grid = document.getElementById("rekamGrid");
    grid.innerHTML = "";
    dashboardData.rekamBelajar.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = item;
      grid.appendChild(card);
    });
  }

  function renderChart(){
    const ctx = document.getElementById('weeklyChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: dashboardData.weeklyActivity.labels,
        datasets: [{
          data: dashboardData.weeklyActivity.values,
          backgroundColor: '#0F2854',
          borderRadius: 2,
          maxBarThickness: 60
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0F2854',
            padding: 10,
            titleFont: { family: 'Poppins' },
            bodyFont: { family: 'Poppins' }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 24,
            ticks: {
              stepSize: 6,
              color: '#1E1E1E',
              font: { family: 'Poppins', size: 13 }
            },
            grid: { color: '#c9c9c9' }
          },
          x: {
            ticks: {
              color: '#1E1E1E',
              font: { family: 'Poppins', size: 13 }
            },
            grid: { display: false }
          }
        }
      }
    });
  }

  /* =========== 5. INISIALISASI =========== */
  document.addEventListener("DOMContentLoaded", () => {
    renderProfile();
    renderAchievements();
    renderRekamBelajar();
    renderChart();

    // Kalau belum login (dashboard dianggap "kosong"), otomatis kunci
    // halaman dan tampilkan popup suruh login.
    if(!isUserLoggedIn()){
      lockDashboard();
    }
  });

  document.getElementById("btnGoLogin").addEventListener("click", () => {
    window.location.href = LOGIN_PAGE_URL;
  });

  document.getElementById("btnGoDaftar").addEventListener("click", () => {
    window.location.href = DAFTAR_PAGE_URL;
  });

  /* =========== 6. SIDEBAR PROFIL =========== */
  function openSidebar(){
    document.body.classList.add("sidebar-open");
  }

  function closeSidebar(){
    document.body.classList.remove("sidebar-open");
  }

  document.getElementById("btnOpenSidebar").addEventListener("click", openSidebar);
  document.getElementById("btnCloseSidebar").addEventListener("click", closeSidebar);
  document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);

  // Menu di dalam sidebar (Profil Saya, Pengaturan, Koleksi Saya)
  // Sekarang masih placeholder — ganti dengan redirect halaman terpisah
  // kalau halamannya sudah dibuat, contoh: window.location.href = "profil.html";
  document.querySelectorAll(".sidebar-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.dataset.target;
      console.log("Menu diklik:", target);
      // window.location.href = target + ".html";
    });
  });

  // Tombol Log out: hapus status login lalu kembali munculkan popup login
  document.getElementById("btnLogout").addEventListener("click", () => {
    localStorage.removeItem("isLoggedIn");
    closeSidebar();
    lockDashboard();
  });
</script>

</body>
</html>
