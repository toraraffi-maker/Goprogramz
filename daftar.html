<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoProgramz - Daftar</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Barlow Semi Condensed & Oswald for authentic condensed text styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        condensed: ['"Barlow Semi Condensed"', '"Oswald"', 'sans-serif'],
                        sans: ['"Barlow Semi Condensed"', 'sans-serif'],
                    },
                    colors: {
                        navBlue: '#208ef0',
                        cardBg: '#e2e2e2',
                        inputBg: '#d6d6d6',
                        inputBorder: '#27272a',
                        brandBlue: '#2094f3',
                        brandBlueHover: '#1976d2'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Barlow Semi Condensed', sans-serif;
            letter-spacing: 0.01em;
            user-select: none;
        }

        /* Coding background with precise dark blue overlay and laptop code scene */
        .bg-coding-overlay {
            background-image: 
                linear-gradient(to bottom, rgba(12, 38, 72, 0.86), rgba(8, 24, 48, 0.92)),
                url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Signup card matching image geometry */
        .register-card {
            background-color: #e2e2e2;
            border-radius: 28px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
        }

        /* Form input fields with clean border and placeholder styling */
        .custom-input {
            background-color: #d6d6d6;
            border: 1.5px solid #27272a;
            border-radius: 12px;
            color: #0f172a;
            transition: all 0.2s ease-in-out;
        }

        .custom-input::placeholder {
            color: #27272a;
            font-weight: 600;
        }

        .custom-input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #2094f3;
            box-shadow: 0 0 0 3px rgba(32, 148, 243, 0.25);
        }

        /* Custom oval button styling */
        

        .logo-text {
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- TOP NAVIGATION BAR --
    <header class="w-full bg-[#208ef0] text-white px-4 sm:px-8 py-2.5 shadow-md z-30">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            
            <!-- Left Navigation Links --
            <nav class="flex items-center space-x-6 sm:space-x-12 text-lg sm:text-xl font-extrabold tracking-wider">
                <a href="index.html" onclick="showNotice('Navigasi ke BERANDA')" class="hover:text-sky-100 transition-colors uppercase">BERANDA</a>
                <a href="#materi" onclick="showNotice('Navigasi ke MATERI')" class="hover:text-sky-100 transition-colors uppercase">MATERI</a>
                <a href="#praktek" onclick="showNotice('Navigasi ke PRAKTEK')" class="hover:text-sky-100 transition-colors uppercase">PRAKTEK</a>
            </nav>

            <!-- Center Logo --
            <div class="text-2xl sm:text-3xl font-black tracking-tight cursor-pointer">
            <span class="text-white">Go</span><span class="text-sky-200">Programz</span>
        </div>
            <!-- Right Login Button --
            <div>
                <button 
                    type="button" 
                    onclick="showNotice('Navigasi ke Halaman Login')" 
                    class="bg-[#e2e2e2] hover:bg-white text-[#208ef0] font-bold px-6 sm:px-8 py-1.5 rounded-full text-base sm:text-lg shadow-sm hover:shadow transition-all transform active:scale-95"
                >
                    <a href="login.html">Login</a>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER WITH CODE OVERLAY BACKGROUND -->
    <main class="flex-1 w-full bg-coding-overlay flex items-center justify-center p-4 py-12 relative">
        
        <!-- REGISTER CARD (EXACT MATCHING IMAGE) -->
        <div class="w-full max-w-[390px] register-card px-7 py-8 sm:px-8 sm:py-9 text-center relative z-10 transition-all">
            
            <!-- Title -->
            <h1 class="text-2xl sm:text-[28px] font-bold text-slate-950 tracking-normal mb-5">
                Daftar ke GoProgramz
            </h1>

            <!-- Form -->
            <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-3">
                
                <!-- Nama Lengkap Input -->
                <div class="relative">
                    <input 
                        type="text" 
                        id="fullnameInput" 
                        required 
                        placeholder="Nama Lengkap" 
                        class="w-full px-4 py-2 custom-input text-slate-950 placeholder-slate-700 font-semibold text-base tracking-normal"
                    >
                </div>

                <!-- E-Mail Input -->
                <div class="relative">
                    <input 
                        type="email" 
                        id="emailInput" 
                        required 
                        placeholder="E-Mail" 
                        class="w-full px-4 py-2 custom-input text-slate-950 placeholder-slate-700 font-semibold text-base tracking-normal"
                    >
                </div>

                <!-- Username Input -->
                <div class="relative">
                    <input 
                        type="text" 
                        id="usernameInput" 
                        required 
                        placeholder="Username" 
                        class="w-full px-4 py-2 custom-input text-slate-950 placeholder-slate-700 font-semibold text-base tracking-normal"
                    >
                </div>

                <!-- Headline Select -->
                <div class="relative">
                    <select 
                        id="headlineInput" 
                        required 
                        class="w-full px-4 py-2 custom-input text-slate-950 font-semibold text-base tracking-normal appearance-none cursor-pointer"
                    >
                        <option value="" disabled selected>Pilih Headline Kamu</option>
                        <option value="UI/UX Designer">UI/UX Designer</option>
                        <option value="Frontend Developer">Frontend Developer</option>
                        <option value="Backend Developer">Backend Developer</option>
                        <option value="Fullstack Developer">Fullstack Developer</option>
                        <option value="Mobile Developer">Mobile Developer</option>
                        <option value="Data Analyst">Data Analyst</option>
                        <option value="Data Scientist">Data Scientist</option>
                        <option value="QA/Software Tester">QA/Software Tester</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-700 text-xs pointer-events-none"></i>
                </div>

                <!-- Password Input -->
                <div class="relative">
                    <input 
                        type="password" 
                        id="passwordInput" 
                        required 
                        placeholder="Password" 
                        class="w-full px-4 py-2 custom-input text-slate-950 placeholder-slate-700 font-semibold text-base tracking-normal pr-10"
                    >
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility('passwordInput', 'eyeIconPassword')" 
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 hover:text-slate-900 focus:outline-none p-1"
                        title="Tampilkan / Sembunyikan Password"
                    >
                        <i id="eyeIconPassword" class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>

                <!-- Password Confirmation Input -->
                <div class="relative">
                    <input 
                        type="password" 
                        id="confirmPasswordInput" 
                        required 
                        placeholder="Konfirmasi Password" 
                        class="w-full px-4 py-2 custom-input text-slate-950 placeholder-slate-700 font-semibold text-base tracking-normal pr-10"
                    >
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility('confirmPasswordInput', 'eyeIconConfirm')" 
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 hover:text-slate-900 focus:outline-none p-1"
                        title="Tampilkan / Sembunyikan Password"
                    >
                        <i id="eyeIconConfirm" class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>

                <!-- Register Submit Button -->
                <div class="pt-2 flex justify-center">
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="bg-[#2094f3] hover:bg-[#1976d2] text-white font-bold px-7 py-1.5 rounded-full text-base sm:text-lg shadow-sm hover:shadow-md active:scale-95 transition-all flex items-center justify-center min-w-[110px]"
                    >
                        <span>Daftar</span>
                    </button>
                </div>
            </form>

            <!-- Login Prompt Link -->
            <div class="mt-3">
                <p class="text-xs sm:text-[13px] font-semibold text-slate-950 tracking-normal">
                    Sudah Punya Akun? <button 
                        type="button" 
                        onclick="showNotice('Navigasi ke Halaman Login')" 
                        class="text-[#2094f3] hover:underline font-bold transition-colors focus:outline-none"
                    ><a href="login.html"> Login Sekarang!</a></button>
                </p>
            </div>
        </div>

    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl hidden items-center space-x-3 z-50 border border-slate-700 transition-all">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastText" class="text-sm font-semibold"></span>
    </div>

    <!-- MODAL PERINGATAN: SUDAH PUNYA AKUN -->
    <div id="accountExistsModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div class="w-14 h-14 bg-sky-100 text-[#2094f3] rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2">Kamu Sudah Punya Akun</h3>
            <p class="text-sm text-slate-600 mb-5">Sepertinya kamu sudah pernah mendaftar di perangkat ini. Silakan login untuk melanjutkan.</p>
            <div class="flex flex-col gap-2">
                <button 
                    type="button" 
                    id="btnModalGoLogin"
                    class="w-full py-2.5 bg-[#2094f3] hover:bg-[#1976d2] text-white rounded-full font-bold text-sm transition-colors shadow-sm"
                >
                    Login Sekarang
                </button>
                <button 
                    type="button" 
                    id="btnModalStayRegister"
                    class="w-full py-2 text-slate-500 hover:text-slate-700 font-semibold text-xs transition-colors"
                >
                    Tetap daftar akun baru
                </button>
            </div>
        </div>
    </div>

    <script>
        // Toggle Password Visibility (dipakai untuk field Password & Konfirmasi Password)
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Handle Register Submission
        function handleRegisterSubmit(event) {
            event.preventDefault();

            const fullname = document.getElementById('fullnameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const username = document.getElementById('usernameInput').value.trim();
            const headline = document.getElementById('headlineInput').value;
            const password = document.getElementById('passwordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;

            if (password !== confirmPassword) {
                showNotice('Password dan Konfirmasi Password tidak cocok!');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i>';

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;

                // ===== GANTI PROSES DUMMY INI DENGAN SIMPAN KE BACKEND/DATABASE NANTI =====
                // simpan data user biar bisa dibaca dashboard
                localStorage.setItem("userFullname", fullname);
                localStorage.setItem("userEmail", email);
                localStorage.setItem("userUsername", username);
                localStorage.setItem("userHeadline", headline);
                // NOTE: password disimpan polos di localStorage hanya untuk keperluan
                // demo/validasi login sisi client. JANGAN dipakai di production —
                // nanti password harus di-hash & divalidasi di backend/database.
                localStorage.setItem("userPassword", password);

                // tandai perangkat ini sudah pernah dipakai untuk daftar
                // (flag ini TIDAK dihapus saat logout, beda dengan isLoggedIn)
                localStorage.setItem("accountRegistered", "true");

                // pendaftaran dianggap berhasil -> langsung anggap sudah login
                localStorage.setItem("isLoggedIn", "true");

                showNotice('Pendaftaran Berhasil! Selamat Datang.');
                document.getElementById('registerForm').reset();

                // Redirect langsung ke dashboard setelah toast sempat muncul sebentar
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 800);

            }, 1000);
        }

        // Show Toast Notification
        function showNotice(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            
            toast.classList.remove('hidden');
            toast.classList.add('flex');

            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 3000);
        }

        /* =========== CEK APAKAH PERANGKAT INI SUDAH PERNAH DAFTAR =========== */
        function checkAccountExists() {
            const alreadyRegistered = localStorage.getItem("accountRegistered") === "true";
            if (alreadyRegistered) {
                const modal = document.getElementById('accountExistsModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        document.addEventListener('DOMContentLoaded', checkAccountExists);

        // Tombol "Login Sekarang" di modal -> arahkan ke halaman login
        document.getElementById('btnModalGoLogin').addEventListener('click', () => {
            window.location.href = "login.html";
        });

        // Tombol "Tetap daftar akun baru" -> tutup modal, biarkan user lanjut isi form
        document.getElementById('btnModalStayRegister').addEventListener('click', () => {
            const modal = document.getElementById('accountExistsModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });
    </script>
</body>
</html>
